<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nowa wiadomość | EduVulcan2.0</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='css/messages.css') }}"></head><body><div class="app-container"><aside class="sidebar"><div class="logo"><h2>EduVulcan<span>2.0</span></h2></div><nav class="navigation"><a href="{{ url_for('roles.mailbox') }}">← Odebrane</a><a class="active" href="{{ url_for('roles.message_new') }}">Nowa wiadomość</a><a href="{{ url_for('roles.mailbox',folder='sent') }}">Wysłane</a></nav></aside><main class="main-content"><header class="topbar"><div><h1>Nowa wiadomość</h1><p>Do jednego użytkownika lub całej grupy</p></div></header>
{% with alerts=get_flashed_messages(with_categories=true) %}{% for cat,msg in alerts %}<div class="ui-alert {{ cat }}">{{ msg }}</div>{% endfor %}{% endwith %}
<section class="content-card mail-compose"><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="form-group"><label>Rodzaj odbiorcy</label><select name="mode" id="mail-mode"><option value="single" {% if request.form.get('mode')!='group' %}selected{% endif %}>Jedna osoba</option><option value="group" {% if request.form.get('mode')=='group' %}selected{% endif %}>Grupa użytkowników</option></select></div>
<div class="form-group" id="single-target"><label>Odbiorca</label><select name="recipient_id"><option value="">Wybierz użytkownika</option>{% for u in users %}<option value="{{ u.id }}" {% if request.form.get('recipient_id')==u.id|string %}selected{% endif %}>{{ u.username }} · {{ {'teacher':'Nauczyciel','student':'Uczeń','admin':'Administrator'}.get(u.role,u.role) }}{% if u.student %} · {{ u.student.first_name }} {{ u.student.last_name }} ({{ u.student.school_class }}){% endif %}</option>{% endfor %}</select></div>
<div class="form-group" id="group-target"><label>Grupa</label><select name="group"><option value="all">Wszyscy użytkownicy</option><option value="students">Wszyscy uczniowie</option><option value="teachers">Wszyscy nauczyciele</option><option value="admins">Administratorzy</option>{% for cls in classes %}<option value="class:{{ cls }}">Uczniowie klasy {{ cls }}</option>{% endfor %}</select></div>
<div class="form-group"><label>Temat</label><input name="subject" maxlength="150" required value="{{ request.form.get('subject','') }}" placeholder="Np. Informacja organizacyjna"></div>
<div class="form-group"><label>Treść</label><textarea name="body" maxlength="10000" required rows="9" placeholder="Napisz wiadomość...">{{ request.form.get('body','') }}</textarea></div>
<div class="form-group"><label>Załącznik (opcjonalnie, do 256 KB)</label><input type="file" name="attachment" accept=".pdf,.png,.jpg,.jpeg,.txt"><small>PDF, PNG, JPG lub TXT. Tylko jeden mały plik.</small></div>
<button class="submit-btn" type="submit">Wyślij wiadomość</button> <a class="mail-cancel" href="{{ url_for('roles.mailbox') }}">Anuluj</a></form></section></main></div>
<script>const mode=document.getElementById('mail-mode'), single=document.getElementById('single-target'), group=document.getElementById('group-target');function refresh(){single.hidden=mode.value!=='single';group.hidden=mode.value!=='group'}mode.addEventListener('change',refresh);refresh();</script></body></html>
